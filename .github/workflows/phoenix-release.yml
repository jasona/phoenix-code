name: Phoenix release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [nightly, stable]
  schedule:
    - cron: "27 6 * * *"

concurrency:
  group: phoenix-release-${{ inputs.channel || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jasona/phoenix-code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - name: Read the nightly scheduling rules
        run: curl --fail --retry 3 --silent --show-error "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/scripts/check-nightly-release.cjs" -o check-nightly-release.cjs
      - id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const { shouldReleaseNightly } = require('./check-nightly-release.cjs');
            core.setOutput('build', context.eventName !== 'schedule' || await shouldReleaseNightly({ github, context, core }));

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.release.outputs.version }}
      migration: ${{ steps.release.outputs.migration }}
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
    steps:
      # The vendored reference trees contain gitlinks without submodule URLs.
      # Fetch the public source without traversing them during checkout cleanup.
      - name: Check out the release commit
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-ci-deps
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev imagemagick patchelf xvfb
      - id: release
        name: Select version and record the bundled database migration
        run: |
          if [[ "$T3CODE_RELEASE_CHANNEL" == nightly ]]; then
            node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" \
              --run-number "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" --github-output
          else
            echo "version=$(jq -r .version apps/desktop/package.json)" >> "$GITHUB_OUTPUT"
          fi
          node --input-type=module -e 'import {migrationManifest} from "./apps/server/src/persistence/Migrations.ts"; console.log("migration=" + Math.max(...migrationManifest.map(([id]) => id)))' >> "$GITHUB_OUTPUT"
      - name: Build Linux x64 desktop and CLI
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node .github/scripts/set-release-version.cjs "$VERSION"
          vp run dist:desktop:linux --build-version "$VERSION"
          node apps/server/scripts/cli.ts build-exe
          install -Dm755 native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/monitor/linux-x64/t3-resource-monitor"
          node scripts/build-cli-archive.ts --resource-monitor-dir "$RUNNER_TEMP/monitor" --platform linux --arch x64 --version "$VERSION" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$VERSION"
      - name: Verify updater assets and launch the packaged desktop
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          track=latest
          if [[ "$T3CODE_RELEASE_CHANNEL" == nightly ]]; then track=nightly; fi
          mkdir publish
          cp release/*.AppImage release/*.deb "release/$track-linux.yml" release-cli/*.tar.gz publish/
          find release -maxdepth 1 -name '*.blockmap' -exec cp {} publish/ \;
          (cd publish && sha256sum *.tar.gz > SHA256SUMS)
          image=$(realpath publish/*.AppImage)
          (cd "$RUNNER_TEMP" && "$image" --appimage-extract > /dev/null)
          config="$RUNNER_TEMP/squashfs-root/resources/app-update.yml"
          grep -Fx 'owner: jasona' "$config"
          grep -Fx 'repo: phoenix-code' "$config"
          grep -Fx "version: $VERSION" "publish/$track-linux.yml"
          xvfb-run -a node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/launch-check" --executable "$RUNNER_TEMP/squashfs-root/t3code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phoenix-linux-x64
          path: publish/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: phoenix-linux-x64
          path: publish
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          MIGRATION: ${{ needs.build.outputs.migration }}
          CHANNEL: ${{ inputs.channel || 'nightly' }}
        run: |
          flags=(--latest)
          if [[ "$CHANNEL" == nightly ]]; then flags=(--prerelease --latest=false); fi
          printf 'Linux x64 desktop and CLI.\n\nDatabase migration: %s\n' "$MIGRATION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Phoenix $VERSION" \
            --notes-file notes.md "${flags[@]}" publish/*
