<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Volcanic Cinder Dusk Sky -->
    <linearGradient id="night" x1="20" y1="0" x2="108" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#170B0C"/>
      <stop offset="48%" stop-color="#291011"/>
      <stop offset="100%" stop-color="#431610"/>
    </linearGradient>
    <!-- Upper Twilight Crimson Haze -->
    <radialGradient id="skyGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(94 24) rotate(138) scale(80 68)">
      <stop stop-color="#9A2B1D" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#5B1614" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#170B0C" stop-opacity="0"/>
    </radialGradient>
    <!-- Molten Horizon Ember Glow -->
    <radialGradient id="horizonGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(64 124) rotate(-90) scale(64 96)">
      <stop stop-color="#EA580C" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#B91C1C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#220C0C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="128" height="128" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="url(#night)"/>
    <rect width="128" height="128" fill="url(#skyGlow)"/>
    <rect width="128" height="128" fill="url(#horizonGlow)"/>

    <!-- Subtle Drifting Cinder Sparks Around Perimeter -->
    <g>
      <circle cx="19" cy="24" r="0.9" fill="#FDE68A" fill-opacity="0.82"/>
      <circle cx="34" cy="15" r="0.6" fill="#FDBA74" fill-opacity="0.65"/>
      <circle cx="106" cy="21" r="0.85" fill="#FDE68A" fill-opacity="0.78"/>
      <circle cx="115" cy="40" r="0.65" fill="#FB923C" fill-opacity="0.68"/>
      <circle cx="13" cy="64" r="0.6" fill="#FB923C" fill-opacity="0.58"/>
      <circle cx="114" cy="76" r="0.75" fill="#FDBA74" fill-opacity="0.62"/>
      <circle cx="24" cy="96" r="0.8" fill="#F97316" fill-opacity="0.7"/>
      <circle cx="102" cy="98" r="0.7" fill="#FDE047" fill-opacity="0.68"/>
      <circle cx="46" cy="112" r="0.55" fill="#FB923C" fill-opacity="0.55"/>
      <circle cx="84" cy="114" r="0.65" fill="#FDBA74" fill-opacity="0.6"/>
    </g>

    <!-- Crisp 4-Point Ember Glints -->
    <path d="M27 32 C27.4 33.4 27.8 33.8 29.2 34.2 C27.8 34.6 27.4 35.0 27 36.4 C26.6 35.0 26.2 34.6 24.8 34.2 C26.2 33.8 26.6 33.4 27 32 Z" fill="#FEF08A" fill-opacity="0.85"/>
    <path d="M101 34 C101.3 35.1 101.6 35.4 102.7 35.7 C101.6 36.0 101.3 36.3 101 37.4 C100.7 36.3 100.4 36.0 99.3 35.7 C100.4 35.4 100.7 35.1 101 34 Z" fill="#FDBA74" fill-opacity="0.75"/>

    <!-- Warm Volcanic Ash-Mist Horizon Strata Below Base -->
    <path d="M-12 117 C16 101 42 104 64 112 C88 120 112 114 140 99 V140 H-12 V117 Z" fill="#2A0D0B" fill-opacity="0.56"/>
    <path d="M-12 126 C18 113 44 116 66 123 C92 130 114 123 140 110 V140 H-12 V126 Z" fill="#8C2612" fill-opacity="0.30"/>
  </g>
</svg>
