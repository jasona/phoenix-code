<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm Anodized Bronze-Slate Drafting Plate -->
    <linearGradient id="paper" x1="16" y1="0" x2="112" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#352B23"/>
      <stop offset="48%" stop-color="#241E19"/>
      <stop offset="100%" stop-color="#14110E"/>
    </linearGradient>
    <!-- Soft Drafting-Lamp Warm Amber Sheen -->
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(96 20) rotate(138) scale(88 78)">
      <stop stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="0.48" stop-color="#B45309" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0"/>
    </radialGradient>
    <!-- Grounded Edge Vignette -->
    <radialGradient id="edgeShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(64 60) rotate(90) scale(78)">
      <stop offset="0.64" stop-color="#0E0C0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#090706" stop-opacity="0.54"/>
    </radialGradient>
    <!-- Fine Engineering Grid in Warm Brass -->
    <pattern id="minorGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0H0V4" stroke="#E8C798" stroke-width="0.2" opacity="0.18"/>
    </pattern>
    <pattern id="majorGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="url(#minorGrid)"/>
      <path d="M16 0H0V16" stroke="#F6D8AA" stroke-width="0.38" opacity="0.34"/>
    </pattern>
    <clipPath id="frame">
      <rect width="128" height="128" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="url(#paper)"/>
    <rect width="128" height="128" fill="url(#amberGlow)"/>
    <rect x="4" y="4" width="120" height="120" fill="url(#majorGrid)"/>
    <!-- Primary Center Axes -->
    <path d="M64 4V124M4 64H124" stroke="#F6D8AA" stroke-width="0.4" opacity="0.36"/>
    <!-- Architectural Inner Drafting Border -->
    <rect x="6" y="6" width="116" height="116" rx="6" stroke="#F5C787" stroke-width="0.6" opacity="0.46"/>
    <rect width="128" height="128" fill="url(#edgeShade)"/>
  </g>
</svg>
